<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130"><title>先看输出，再选接口</title><rect x="0" y="0" width="1000" height="1130" rx="20" fill="#eef2e6" stroke="none" stroke-width="2"/><text x="52" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#55704b">THE TECH MORNING / VISUAL NOTE</text><text x="52" y="145" font-family="Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#17312f">先看输出，再选接口</text><text x="52" y="207" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">依据 Decisions 官方文档的接口分工</text><rect x="52" y="253" width="896" height="242" rx="18" fill="#17312f" stroke="none" stroke-width="2"/><text x="85" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#e3f5b1">有限输出 → Decisions</text><text x="85" y="376" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#fffef8">条件概率 · 固定选项 · 等级评分</text><text x="85" y="440" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" fill="#c9d5c7">分别对应 predicate / choice / score</text><rect x="52" y="527" width="896" height="204" rx="18" fill="#fffef8" stroke="none" stroke-width="2"/><text x="85" y="590" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">自定义 JSON 或解释文字</text><text x="85" y="658" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="400" fill="#536d61">Responses + Structured Outputs</text><rect x="52" y="765" width="896" height="204" rx="18" fill="#fffef8" stroke="none" stroke-width="2"/><text x="85" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#17312f">要求模型提出带参数的工具调用</text><text x="85" y="895" font-family="Noto Sans CJK SC, sans-serif" font-size="42" font-weight="400" fill="#536d61">Function calling</text><text x="52" y="1090" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#536d61">官方接口分工示意 · 不是“简单 / 复杂”能力分界</text></svg>