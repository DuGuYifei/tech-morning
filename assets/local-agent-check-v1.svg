<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150"><title>能修复，也要能验收</title><rect x="0" y="0" width="1000" height="1150" rx="18" fill="#eef2e6"/><text x="52" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#55704b">THE TECH MORNING / VISUAL NOTE</text><text x="52" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="58" font-weight="700" fill="#17312f">能修复，也要能验收</text><text x="52" y="208" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">本地 Agent 数据工程实验 · 方法简图</text><rect x="52" y="250" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="278" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="323" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">01</text><text x="162" y="316" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">固定任务与离线数据</text><text x="162" y="375" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">先明确目标产物和任务边界</text><rect x="52" y="460" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="488" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="533" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">02</text><text x="162" y="526" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">读写、执行、检查、修复</text><text x="162" y="585" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">Agent 在工具反馈中多轮迭代</text><rect x="52" y="670" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="698" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="743" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">03</text><text x="162" y="736" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">提交后，独立检查产物</text><text x="162" y="795" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">隐藏的确定性检查器评分</text><rect x="52" y="885" width="896" height="155" rx="18" fill="#17312f"/><text x="82" y="945" font-family="Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" fill="#e3f5b1">工具闭环 ≠ 已证明生产可靠</text><text x="82" y="1003" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#fffef8">实验只覆盖特定任务与模型配置</text><text x="52" y="1110" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#536d61">论文方法编辑简图 · 未复跑实验</text></svg>