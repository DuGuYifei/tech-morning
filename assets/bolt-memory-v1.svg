<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><title>24GB预算，装了什么？</title><rect x="0" y="0" width="1000" height="720" fill="#eef2e8" rx="0"/><text x="48" y="80" font-family="Noto Sans CJK SC,sans-serif" font-size="50" font-weight="700" fill="#182e37">24GB预算，装了什么？</text><text x="48" y="140" font-family="Noto Sans CJK SC,sans-serif" font-size="31" font-weight="400" fill="#56746b">Nemotron 3.5 Bolt · 文本推理估算</text><rect x="50" y="190" width="900" height="86" fill="#d7e1d5" rx="20"/><rect x="50" y="190" width="830" height="86" fill="#17343d" rx="0"/><rect x="880" y="190" width="33" height="86" fill="#9dbb5e" rx="0"/><rect x="913" y="190" width="37" height="86" fill="#ddad65" rx="0"/><rect x="54" y="323" width="35" height="35" fill="#17343d" rx="4"/><text x="120" y="360" font-family="Noto Sans CJK SC,sans-serif" font-size="46" font-weight="700" fill="#182e37">权重 ≈ 22 GB</text><rect x="54" y="403" width="35" height="35" fill="#9dbb5e" rx="4"/><text x="120" y="440" font-family="Noto Sans CJK SC,sans-serif" font-size="46" font-weight="700" fill="#182e37">缓存与激活 ≈ 0.9 GB</text><rect x="54" y="483" width="35" height="35" fill="#ddad65" rx="4"/><text x="120" y="520" font-family="Noto Sans CJK SC,sans-serif" font-size="46" font-weight="700" fill="#182e37">草稿模型 ≈ 1 GB</text><text x="50" y="610" font-family="Noto Sans CJK SC,sans-serif" font-size="53" font-weight="700" fill="#182e37">合计约 23.8 GB</text><text x="50" y="670" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" fill="#56746b">批量 1 · 128K 上下文 · 不含视觉组件</text><text x="50" y="704" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#56746b">依据官方报告 §8.2 · 四舍五入 · 非本刊实测</text></svg>