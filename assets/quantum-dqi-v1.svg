<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#eef2e8"/><g font-family="Noto Sans CJK SC,sans-serif"><text x="45" y="72" font-size="49" fill="#17343d" font-weight="700">量子电路的两笔资源账</text><text x="45" y="126" font-size="31" fill="#57726d" font-weight="500">DQI 的 Reed–Solomon 解码器</text><text x="45" y="187" font-size="36" fill="#17343d" font-weight="700">Toffoli 门数</text><rect x="45" y="213" width="830.0" height="48" rx="5" fill="#bbccc2"/><text x="65" y="247" font-size="29" fill="#17343d" font-weight="500">此前基线 ≈ 510万</text><rect x="45" y="280" width="71.6" height="48" rx="5" fill="#bdd477"/><text x="65" y="314" font-size="29" fill="#17343d" font-weight="500">新电路 ≈ 44万</text><text x="650" y="187" font-size="28" fill="#57726d" font-weight="500">约为基线的 1/12</text><text x="45" y="405" font-size="36" fill="#17343d" font-weight="700">逻辑量子比特</text><rect x="45" y="431" width="830.0" height="48" rx="5" fill="#bbccc2"/><text x="65" y="465" font-size="29" fill="#17343d" font-weight="500">此前基线 1938</text><rect x="45" y="498" width="786.7" height="48" rx="5" fill="#bdd477"/><text x="65" y="532" font-size="29" fill="#17343d" font-weight="500">新电路 1837</text><text x="650" y="405" font-size="28" fill="#57726d" font-weight="500">减少约 5.2%</text><text x="45" y="650" font-size="29" fill="#57726d" font-weight="500">各组独立刻度，均从零起点比较</text><text x="45" y="695" font-size="26" fill="#57726d" font-weight="500">论文表1资源估计；不是整机实测加速 · 编辑原创</text></g></svg>