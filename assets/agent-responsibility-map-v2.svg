<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030"><title>一个 Agent，三份职责</title><rect x="0" y="0" width="1000" height="1030" rx="20" fill="#eef2e6" stroke="none" stroke-width="2"/><text x="52" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#55704b">THE TECH MORNING / VISUAL NOTE</text><text x="52" y="145" font-family="Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#17312f">一个 Agent，三份职责</text><text x="52" y="207" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">组件分工示意；不是严格执行顺序</text><rect x="52" y="252" width="896" height="157" rx="18" fill="#fffef8" stroke="none" stroke-width="2"/><rect x="76" y="280" width="64" height="64" rx="32" fill="#d6ed96" stroke="none" stroke-width="2"/><text x="93" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">01</text><text x="167" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" fill="#17312f">应用服务</text><text x="167" y="375" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">产品集成 · 提交任务 · 处理事件</text><path d="M500 423v32m-12-12 12 12 12-12" stroke="#627c57" stroke-width="4" fill="none"/><rect x="52" y="473" width="896" height="157" rx="18" fill="#fffef8" stroke="none" stroke-width="2"/><rect x="76" y="501" width="64" height="64" rx="32" fill="#d6ed96" stroke="none" stroke-width="2"/><text x="93" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">02</text><text x="167" y="539" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" fill="#17312f">运行层 / Harness</text><text x="167" y="596" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">模型与工具循环 · 会话</text><path d="M500 644v32m-12-12 12 12 12-12" stroke="#627c57" stroke-width="4" fill="none"/><rect x="52" y="694" width="896" height="157" rx="18" fill="#fffef8" stroke="none" stroke-width="2"/><rect x="76" y="722" width="64" height="64" rx="32" fill="#d6ed96" stroke="none" stroke-width="2"/><text x="93" y="767" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">03</text><text x="167" y="760" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" fill="#17312f">执行环境 / 可选</text><text x="167" y="817" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">计算资源 · 文件 · 生命周期</text><text x="52" y="990" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#536d61">依据 Agents API 架构文档 · 原创职责示意</text></svg>