<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190"><title>锁住版本，也看清范围</title><rect x="0" y="0" width="1000" height="1190" rx="18" fill="#eef2e6"/><text x="52" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#55704b">THE TECH MORNING / VISUAL NOTE</text><text x="52" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="56" font-weight="700" fill="#17312f">锁住版本，也看清范围</text><text x="52" y="210" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">GitHub Actions · 公开预览</text><rect x="52" y="252" width="896" height="168" rx="18" fill="#fffef8"/><rect x="76" y="280" width="64" height="64" rx="32" fill="#d6ed96"/><text x="91" y="326" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">01</text><text x="161" y="317" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#17312f">工作流保留可读引用</text><text x="161" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">例如：某个 action 的版本标签</text><rect x="52" y="450" width="896" height="168" rx="18" fill="#fffef8"/><rect x="76" y="478" width="64" height="64" rx="32" fill="#d6ed96"/><text x="91" y="524" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">02</text><text x="161" y="515" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#17312f">锁文件记录确定提交</text><text x="161" y="578" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">纳入的工作流按锁定提交执行</text><rect x="52" y="648" width="896" height="168" rx="18" fill="#fffef8"/><rect x="76" y="676" width="64" height="64" rx="32" fill="#d6ed96"/><text x="91" y="722" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">03</text><text x="161" y="713" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#17312f">跨仓库调用有边界</text><text x="161" y="776" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">可复用工作流内部看定义仓库</text><rect x="52" y="852" width="896" height="206" rx="18" fill="#17312f"/><text x="82" y="916" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" fill="#e3f5b1">锁定版本 ≠ 证明代码安全</text><text x="82" y="979" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="400" fill="#fffef8">生成与更新使用官方工具</text><text x="82" y="1030" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#fffef8">安全审查、依赖升级仍需保留</text><text x="52" y="1140" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#536d61">编辑示意 · 非完整依赖树 · 不改变本站工作流</text></svg>