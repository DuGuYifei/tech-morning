<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1140" viewBox="0 0 1000 1140"><title>一次提交，三种身份</title><rect x="0" y="0" width="1000" height="1140" rx="18" fill="#eef2e6"/><text x="52" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#55704b">THE TECH MORNING / VISUAL NOTE</text><text x="52" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="58" font-weight="700" fill="#17312f">一次提交，三种身份</text><text x="52" y="208" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">推送归属补充审计线索，不保证代码安全</text><rect x="52" y="250" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="278" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="323" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">01</text><text x="162" y="316" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">Author / 作者</text><text x="162" y="375" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">Git 提交中由客户端填写</text><rect x="52" y="440" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="468" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="513" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">02</text><text x="162" y="506" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">Committer / 提交者</text><text x="162" y="565" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">Git 提交中由客户端填写</text><rect x="52" y="630" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="658" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="703" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">03</text><text x="162" y="696" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">Pusher / 推送者</text><text x="162" y="755" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">GitHub 认证的实际推送账号</text><rect x="52" y="825" width="896" height="199" rx="18" fill="#17312f"/><text x="82" y="884" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" fill="#e3f5b1">新增规则可检查：</text><text x="82" y="945" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400" fill="#fffef8">提交者是否匹配推送者的已验证邮箱</text><text x="82" y="997" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" fill="#c9d5c7">匹配也不代表其他规则必然放行</text><text x="52" y="1102" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#536d61">编辑示意 · 规则需配置 · Enterprise 有限公开预览</text></svg>