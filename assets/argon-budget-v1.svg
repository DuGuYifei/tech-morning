<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100"><title>一个窗口，三类消耗</title><rect x="0" y="0" width="1000" height="1100" rx="18" fill="#eef2e6"/><text x="52" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#55704b">THE TECH MORNING / VISUAL NOTE</text><text x="52" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="58" font-weight="700" fill="#17312f">一个窗口，三类消耗</text><text x="52" y="208" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" fill="#536d61">Gemini 4 Argon · 统一上下文预算</text><rect x="52" y="250" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="278" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="323" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">01</text><text x="162" y="316" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">输入 / Input</text><text x="162" y="375" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">提示、文件与已有上下文</text><rect x="52" y="450" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="478" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="523" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">02</text><text x="162" y="516" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">思考 / Thinking</text><text x="162" y="575" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">模型推理所用的 token</text><rect x="52" y="650" width="896" height="162" rx="18" fill="#fffef8"/><rect x="76" y="678" width="64" height="64" rx="32" fill="#d6ed96"/><text x="92" y="723" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#17312f">03</text><text x="162" y="716" font-family="Noto Sans CJK SC, sans-serif" font-size="45" font-weight="700" fill="#17312f">输出 / Output</text><text x="162" y="775" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#536d61">最终返回内容所用的 token</text><rect x="52" y="850" width="896" height="142" rx="18" fill="#17312f"/><text x="82" y="907" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#e3f5b1">合计上限：1,048,576 token</text><text x="82" y="966" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" fill="#fffef8">共享总量，不是每类各有一百万</text><text x="52" y="1062" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#536d61">编辑示意 · 卡片大小不代表实际占比</text></svg>