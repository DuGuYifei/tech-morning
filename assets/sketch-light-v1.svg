<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><title>星星和月亮，变成光影指令</title><rect x="0" y="0" width="1000" height="720" fill="#eef2e8" rx="0"/><text x="42" y="78" font-family="Noto Sans CJK SC,sans-serif" font-size="47" font-weight="700" fill="#182e37">星星和月亮，变成光影指令</text><text x="42" y="136" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" fill="#56746b">草图标记 → 光源与网格 → 可编辑场景</text><path d="M140 224 L205 196 Q250 237 295 196 L360 224 L408 340 L340 366 L315 308 L340 550 L160 550 L185 308 L160 366 L92 340 Z" fill="#fffdf4" stroke="#17343d" stroke-width="5"/><text x="205" y="306" font-family="Noto Sans CJK SC,sans-serif" font-size="66" font-weight="400" fill="#c1943a">★</text><text x="230" y="456" font-family="Noto Sans CJK SC,sans-serif" font-size="70" font-weight="400" fill="#527d79">☾</text><text x="430" y="382" font-family="Noto Sans CJK SC,sans-serif" font-size="62" font-weight="400" fill="#587c6c">→</text><defs><linearGradient id="cloth"><stop offset="0" stop-color="#b9d1c2"/><stop offset=".5" stop-color="#e7efd4"/><stop offset="1" stop-color="#587c70"/></linearGradient></defs><path d="M140 224 L205 196 Q250 237 295 196 L360 224 L408 340 L340 366 L315 308 L340 550 L160 550 L185 308 L160 366 L92 340 Z" transform="translate(480 0)" fill="url(#cloth)" stroke="#17343d" stroke-width="5"/><path d="M670 330 Q648 430 674 535" fill="none" stroke="#50776a" stroke-width="5" opacity=".65"/><path d="M710 330 Q688 430 714 535" fill="none" stroke="#50776a" stroke-width="5" opacity=".65"/><path d="M750 330 Q728 430 754 535" fill="none" stroke="#50776a" stroke-width="5" opacity=".65"/><path d="M790 330 Q768 430 794 535" fill="none" stroke="#50776a" stroke-width="5" opacity=".65"/><circle cx="915" cy="214" r="27" fill="#e0ba60"/><path d="M887 238 L822 295" fill="none" stroke="#c1943a" stroke-width="5" stroke-linecap="round"/><path d="M905 250 L869 322" fill="none" stroke="#c1943a" stroke-width="5" stroke-linecap="round"/><text x="90" y="610" font-family="Noto Sans CJK SC,sans-serif" font-size="37" font-weight="700" fill="#182e37">标出亮处与暗处</text><text x="564" y="610" font-family="Noto Sans CJK SC,sans-serif" font-size="37" font-weight="700" fill="#182e37">生成光源和褶皱</text><text x="42" y="670" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" fill="#56746b">原创流程示意 · 不是论文结果图</text><text x="42" y="710" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" fill="#56746b">星/月位置表达意图；换光后阴影会随之改变</text></svg>