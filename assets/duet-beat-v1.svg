<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#eef2e8"/><g font-family="Noto Sans CJK SC,sans-serif"><text x="45" y="78" font-size="49" fill="#17343d" font-weight="700">没有落音，也可能有一拍</text><text x="45" y="134" font-size="31" fill="#57726d" font-weight="500">DuET：音符与连续时间，两条视角</text><text x="45" y="213" font-size="34" fill="#17343d" font-weight="500">音符起点</text><text x="45" y="351" font-size="34" fill="#17343d" font-weight="500">节拍位置</text><path d="M250 205H925M250 345H925" stroke="#8b9e97" stroke-width="4"/><circle cx="280" cy="205" r="17" fill="#18383f"/><circle cx="680" cy="205" r="17" fill="#18383f"/><circle cx="880" cy="205" r="17" fill="#18383f"/><path d="M280 325v40" stroke="#92b151" stroke-width="11"/><path d="M480 325v40" stroke="#92b151" stroke-width="11"/><path d="M680 325v40" stroke="#92b151" stroke-width="11"/><path d="M880 325v40" stroke="#92b151" stroke-width="11"/><circle cx="480" cy="345" r="34" fill="none" stroke="#bd9140" stroke-width="4"/><path d="M480 305V238" stroke="#bd9140" stroke-width="3" stroke-dasharray="8 7"/><text x="340" y="420" font-size="38" fill="#87631f" font-weight="700">这一拍，没有新音符</text><rect x="45" y="470" width="910" height="130" rx="15" fill="#dce7d0"/><text x="75" y="523" font-size="40" fill="#17343d" font-weight="700">音符编码器 ↔ 时间帧编码器</text><text x="75" y="572" font-size="32" fill="#17343d" font-weight="500">共同推断谱面时值、声部与小节位置</text><text x="45" y="659" font-size="30" fill="#57726d" font-weight="500">概念示意，非真实曲目或模型输出</text><text x="45" y="701" font-size="27" fill="#57726d" font-weight="500">节拍仅作示意；模型时间帧间隔为20毫秒</text></g></svg>